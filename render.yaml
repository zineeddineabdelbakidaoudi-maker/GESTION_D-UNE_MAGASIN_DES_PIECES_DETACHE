services:
  # 1. Express API Backend Web Service
  - type: web
    name: gestion-veloo-server
    env: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install && pnpm rebuild better-sqlite3 && pnpm --filter @gestion-veloo/shared build && pnpm --filter @gestion-veloo/server build
    startCommand: pnpm --filter @gestion-veloo/server start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true

  # 2. React / Vite Web Dashboard Static Site
  - type: web
    name: gestion-veloo-web
    env: static
    buildCommand: pnpm install && pnpm --filter @gestion-veloo/shared build && pnpm --filter @gestion-veloo/web build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: gestion-veloo-server
          property: host
